<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>TodoDesk 作品封面</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;overflow:hidden;background:#101014;color:#f1eff5;font-family:Arial,"Microsoft YaHei",sans-serif}.cover{position:relative;width:1200px;height:630px;overflow:hidden;background:radial-gradient(ellipse at 86% 46%,#32395180,transparent 60%);padding:58px 64px}.eyebrow{font-size:13px;letter-spacing:3px;color:#adbdf2}.brand{font-size:72px;font-weight:700;letter-spacing:-4px;margin:60px 0 24px;line-height:1}.brand span{color:#adbdf2}h1{font-size:35px;line-height:1.5;letter-spacing:-1px;font-weight:600;margin:0}p{font-size:17px;color:#abaebe;line-height:1.8;margin:18px 0 28px}.features{display:flex;gap:10px}.features span{font-size:13px;border:1px solid #424a65;border-radius:24px;padding:9px 14px;background:#252b3d;color:#c3cef4}.footer{position:absolute;left:64px;bottom:48px;font-size:12px;letter-spacing:2px;color:#98a8d3}.screen{position:absolute;margin:0;border:1px solid #56607d;border-radius:12px;overflow:hidden;box-shadow:0 25px 55px #0009;background:#20242d}.screen img{display:block;width:100%;height:auto}.tasks{width:492px;left:560px;top:87px;transform:rotate(-5deg)}.stats{width:272px;left:901px;top:190px;transform:rotate(5deg)}.screens-label{position:absolute;left:570px;right:36px;bottom:32px;text-align:center;color:#98a8c7;font-size:11px;letter-spacing:4px}
</style>
<div class="cover">
 <div class="eyebrow">YOUR DAY. ONE TASK AT A TIME.</div>
 <div class="brand">Todo<span>Desk.</span></div>
 <h1>把事情，<br>一件件做好。</h1>
 <p>记下想法，安排轻重缓急，<br>让每一份投入都有迹可循。</p>
 <div class="features"><span>任务整理</span><span>时间提醒</span><span>计时统计</span></div>
 <div class="footer">Windows · 本地优先 · MIT 开源</div>
 <figure class="screen tasks"><img src="preview-dark.png" alt="TodoDesk 真实深色待办界面，使用隔离演示数据"></figure>
 <figure class="screen stats"><img src="preview-statistics-dark.png" alt="TodoDesk 真实时间统计界面，使用隔离演示数据"></figure>
 <div class="screens-label">待办清单 · 时间统计</div>
</div>
</html>
