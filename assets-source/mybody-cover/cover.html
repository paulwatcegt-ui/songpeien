<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>myBody 作品封面</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;overflow:hidden;background:#101014;font-family:Arial,"Microsoft YaHei",sans-serif;color:#f1eff5}.cover{position:relative;width:1200px;height:630px;background:radial-gradient(ellipse at 90% 50%, #17412c 0,transparent 58%);padding:58px 64px}.eyebrow{font-size:13px;letter-spacing:3px;color:#8bbb9b}.brand{font-size:86px;font-weight:700;letter-spacing:-5px;margin:65px 0 20px;line-height:1}.brand span{color:#30d158}h1{font-size:35px;line-height:1.5;letter-spacing:-1px;font-weight:600;margin:0}p{font-size:17px;color:#a6b6ad;line-height:1.8;margin:18px 0 28px}.features{display:flex;gap:12px}.features span{font-size:13px;border:1px solid #345040;border-radius:24px;padding:9px 15px;background:#173023;color:#b2dfc0}.footer{position:absolute;left:64px;bottom:48px;font-size:12px;letter-spacing:2px;color:#7fac8d}
.screens{position:absolute;inset:0;pointer-events:none}.screen{position:absolute;margin:0;padding:5px;border:1px solid #53695c;border-radius:25px;background:#111a15;box-shadow:0 24px 50px #0009;overflow:hidden}.screen img{display:block;width:100%;height:auto;border-radius:19px}.screen.photos{width:192px;left:646px;top:119px;transform:rotate(-9deg);z-index:1}.screen.trends{width:200px;left:963px;top:108px;transform:rotate(9deg);z-index:2}.screen.overview{width:238px;left:799px;top:48px;z-index:3;box-shadow:0 28px 60px #000b}.screens-label{position:absolute;left:720px;right:32px;bottom:32px;text-align:center;color:#a0b4a7;font-size:11px;letter-spacing:4px}
</style>
<div class="cover">
 <div class="eyebrow">YOUR BODY. YOUR JOURNEY.</div>
 <div class="brand">my<span>Body.</span></div>
 <h1>每一次记录，<br>都让变化更清晰。</h1>
 <p>从日常指标到长期趋势，<br>用记录，看见身体的变化。</p>
 <div class="features"><span>指标记录</span><span>趋势曲线</span><span>照片对比</span></div>
 <div class="footer">Android · iOS · 本地记录与备份</div>
 <div class="screens">
  <figure class="screen photos"><img src="photos-user.jpg" alt="用户提供的 myBody 照片页面"></figure>
  <figure class="screen trends"><img src="trends-user.jpg" alt="用户提供的 myBody 体重趋势页面"></figure>
  <figure class="screen overview"><img src="overview-user.jpg" alt="用户提供的 myBody 健康摘要页面"></figure>
  <div class="screens-label">总览 · 趋势 · 照片</div>
 </div>
</div>
</html>
